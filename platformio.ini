[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ; E-Paper display driver (escolha baseado no seu display)
    ; Descomente a linha correta para seu modelo:
    ; https://registry.platformio.org/libraries/zinggjm/GxEPD2
    zinggjm/GxEPD2@^1.5.4

    ; Dependências do GxEPD2
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Teste 4-gray: projeto separado em test_gray/ (pio run -d test_gray)
